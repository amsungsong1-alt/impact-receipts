# nginx/conf.d/impactproof.conf
#
# Replace YOUR_DOMAIN_HERE (both server blocks) with your real domain before
# the first deploy. TLS bootstrap is a two-phase process -- see
# scripts/deploy_vps.sh and README.md's "Docker / VPS deployment" section:
#   1. Comment out (or don't yet reference) the ssl_certificate lines below
#      and bring Nginx up HTTP-only, so it can serve the ACME challenge.
#   2. Run the certbot bootstrap command (README.md) to obtain the first
#      certificate, then uncomment the ssl_certificate lines and reload.
# After that, a host-crontab renewal entry keeps the certificate current --
# docker-compose's `restart: unless-stopped` does NOT schedule renewal on
# its own.

server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN_HERE;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;

    # Laudon Ch.8 hardening: Mozilla's "intermediate" TLS profile as of this
    # writing -- TLSv1.2+TLSv1.3 only (no TLSv1/1.1/SSLv3), a curated cipher
    # list for the TLSv1.2 fallback (TLSv1.3 negotiates its own fixed suite,
    # unaffected by ssl_ciphers). Re-verify against
    # https://ssl-config.mozilla.org/ periodically -- recommendations shift
    # as weaknesses are found and older clients age out of the compatibility
    # matrix.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS (Laudon Ch.8, C2 -- risk #12): tells every browser that has ever
    # loaded this site to refuse plain HTTP for the next year, closing the
    # downgrade/MITM window the plain 80->443 redirect above still leaves
    # open on a client's very first request. `always` so it's sent on error
    # responses too, not just 2xx. Start without `preload` -- submitting to
    # the browser preload list is a one-way door (removal takes months to
    # propagate) and should be a deliberate later decision, not a default.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Docker's embedded DNS (127.0.0.11) resolves the "app" service name to a
    # container IP. A plain `proxy_pass http://app:8501` resolves that name
    # ONCE per worker process and caches the IP for the worker's whole
    # lifetime -- when the app container is recreated (a deploy) or restarted
    # on its own (Docker's `restart: unless-stopped`, e.g. after an OOM kill),
    # it gets a new internal IP that nginx has no reason to know about unless
    # someone reloads nginx at that exact moment. The result: nginx keeps
    # sending traffic to a dead IP, which reads as "hangs for a long time,
    # then 502" rather than a fast failure, until the next manual reload.
    # Routing proxy_pass through a variable instead forces nginx to re-resolve
    # via this resolver on every request (bounded by valid=), closing that gap
    # regardless of why/when the app container's IP changed.
    resolver 127.0.0.11 valid=10s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_proxied any;

    # Streamlit's own health endpoint -- kept out of the general rate-limit
    # zone and access log noise.
    location /_stcore/health {
        set $app_upstream app:8501;
        proxy_pass http://$app_upstream/_stcore/health;
        access_log off;
    }

    location / {
        limit_req zone=impactproof_limit burst=20 nodelay;

        set $app_upstream app:8501;
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;

        # Required -- Streamlit's core interaction model is WebSocket-based;
        # without these, the app loads but live reruns/updates silently stop
        # working.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Required -- .streamlit/config.toml sets enableXsrfProtection=true,
        # which checks the Host header on every request. Without this, every
        # request behind the proxy fails Streamlit's own XSRF check.
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived websocket -- don't let Nginx kill idle connections.
        proxy_read_timeout 86400;
    }
}
