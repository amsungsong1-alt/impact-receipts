services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "8501"
    # save_all_files()/_load_trend_history() (app.py) read/write these three
    # directories with plain relative paths -- without a volume they live
    # only in the container's writable layer, and `docker compose up -d
    # --build` recreates that layer from scratch on every deploy. Named
    # volumes here mount just these three subdirectories, not all of /app,
    # so a fresh image's code still comes from the image itself; only this
    # data persists across redeploys.
    volumes:
      - trend-inputs:/app/inputs
      - trend-evaluations:/app/evaluations
      - trend-outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot

  # Not a long-running service -- no restart policy. Invoked on demand via
  # `docker compose run --rm certbot ...` for initial cert issuance and via
  # a host-crontab entry for renewal. See README.md's "Docker / VPS
  # deployment" section for the exact commands.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  certbot-etc:
  certbot-www:
  trend-inputs:
  trend-evaluations:
  trend-outputs:
